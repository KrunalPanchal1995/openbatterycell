[project]
name = "openbatterycell"
version = "0.1.0"
description = "Learn how a battery cell works: electrode potentials, series and parallel packs, the Nernst equation and discharge, in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
